[project]
name = "readwise-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matt Dorn", email = "matt.dorn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "markdownify>=1.2.3",
    "requests>=2.34.2",
    "weasyprint>=70.0",
]

[project.scripts]
readwise-tools = "readwise_tools.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=readwise_tools --cov-report=term-missing"

[tool.coverage.run]
source = ["readwise_tools"]
